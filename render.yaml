services:
  - type: web
    name: valorant-premier-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HENRIK_API_KEY      # secret — set in the Render dashboard
        sync: false
      - key: PREMIER_TEAM_NAME
        value: THEIRONONES
      - key: PREMIER_TEAM_TAG
        value: IRON
      - key: PREMIER_REGION
        value: na
      - key: MAX_MATCHES
        value: "25"
      - key: TRADE_WINDOW_MS
        value: "3000"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        value: "1524872548800794803"
      - key: DISCORD_CHANNEL_ID
        value: "1524873462768734451"
      - key: DISCORD_POLL_SCAN_LIMIT
        value: "500"
